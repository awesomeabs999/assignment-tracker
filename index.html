<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 2rem;
            max-width: 680px;
            margin: 0 auto;
            transition: background 0.2s, color 0.2s;
        }

        body.dark {
            background: #0f0f0f;
            color: #e5e5e5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            transition: color 0.2s;
        }

        body.dark h1 {
            color: #e5e5e5;
        }

        .theme-toggle {
            padding: 0.5rem 0.75rem;
            background: transparent;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            color: #666;
            transition: all 0.15s;
        }

        body.dark .theme-toggle {
            border-color: #333;
            color: #999;
        }

        .theme-toggle:hover {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        body.dark .theme-toggle:hover {
            background: #1a1a1a;
            color: #e5e5e5;
        }

        .add-form {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        input, select {
            padding: 0.625rem 0.875rem;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 0.875rem;
            background: #fff;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.15s, background 0.2s, color 0.2s;
        }

        body.dark input, body.dark select {
            background: #1a1a1a;
            border-color: #333;
            color: #e5e5e5;
        }

        input:focus, select:focus {
            border-color: #007aff;
        }

        input::placeholder {
            color: #a0a0a0;
        }

        body.dark input::placeholder {
            color: #666;
        }

        #assignmentInput {
            flex: 1;
        }

        #dueDateInput {
            width: 140px;
        }

        #priorityInput {
            width: 110px;
        }

        button.add-btn {
            padding: 0.625rem 1.25rem;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        body.dark button.add-btn {
            background: #e5e5e5;
            color: #0f0f0f;
        }

        button.add-btn:hover {
            background: #333;
        }

        body.dark button.add-btn:hover {
            background: #ccc;
        }

        .assignments-list {
            list-style: none;
        }

        .assignment-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #f0f0f0;
            transition: border-color 0.2s;
        }

        body.dark .assignment-item {
            border-bottom-color: #1a1a1a;
        }

        .assignment-item:last-child {
            border-bottom: none;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #d0d0d0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        body.dark .checkbox {
            border-color: #444;
        }

        .checkbox.checked {
            background: #1a1a1a;
            border-color: #1a1a1a;
        }

        body.dark .checkbox.checked {
            background: #e5e5e5;
            border-color: #e5e5e5;
        }

        .checkbox.checked::after {
            content: '✓';
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
        }

        body.dark .checkbox.checked::after {
            color: #0f0f0f;
        }

        .assignment-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .assignment-name {
            font-size: 0.9375rem;
            color: #1a1a1a;
            transition: color 0.2s;
        }

        body.dark .assignment-name {
            color: #e5e5e5;
        }

        .assignment-item.completed .assignment-name {
            color: #a0a0a0;
            text-decoration: line-through;
        }

        body.dark .assignment-item.completed .assignment-name {
            color: #555;
        }

        .assignment-meta {
            font-size: 0.75rem;
            color: #888;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            transition: color 0.2s;
        }

        body.dark .assignment-meta {
            color: #666;
        }

        .priority-badge {
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.6875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        body.dark .priority-high {
            background: #450a0a;
            color: #fca5a5;
        }

        .priority-medium {
            background: #fef3c7;
            color: #d97706;
        }

        body.dark .priority-medium {
            background: #451a03;
            color: #fcd34d;
        }

        .priority-low {
            background: #d1fae5;
            color: #059669;
        }

        body.dark .priority-low {
            background: #064e3b;
            color: #6ee7b7;
        }

        .delete-btn {
            padding: 0.375rem 0.625rem;
            background: transparent;
            color: #a0a0a0;
            border: none;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            opacity: 0;
        }

        body.dark .delete-btn {
            color: #555;
        }

        .assignment-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        body.dark .delete-btn:hover {
            background: #450a0a;
            color: #fca5a5;
        }

        .empty-state {
            text-align: center;
            color: #a0a0a0;
            font-size: 0.875rem;
            padding: 3rem 0;
            transition: color 0.2s;
        }

        body.dark .empty-state {
            color: #555;
        }

        .stats {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f0f0f0;
            transition: color 0.2s, border-color 0.2s;
        }

        body.dark .stats {
            color: #666;
            border-bottom-color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Assignments</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">Dark</button>
    </div>
    
    <div class="add-form">
        <input type="text" id="assignmentInput" placeholder="Add assignment..." autocomplete="off">
        <input type="date" id="dueDateInput">
        <select id="priorityInput">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>
        <button class="add-btn" onclick="addAssignment()">Add</button>
    </div>

    <div class="stats" id="stats"></div>
    <ul class="assignments-list" id="assignmentsList"></ul>

    <script>
        let assignments = JSON.parse(localStorage.getItem('assignments')) || [];
        let isDark = localStorage.getItem('theme') === 'dark';

        function save() {
            localStorage.setItem('assignments', JSON.stringify(assignments));
            render();
        }

        function toggleTheme() {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme();
        }

        function applyTheme() {
            document.body.classList.toggle('dark', isDark);
            document.getElementById('themeToggle').textContent = isDark ? 'Light' : 'Dark';
        }

        function addAssignment() {
            const input = document.getElementById('assignmentInput');
            const dueDate = document.getElementById('dueDateInput');
            const priority = document.getElementById('priorityInput');
            
            if (input.value.trim() === '') return;

            assignments.push({
                id: Date.now(),
                name: input.value.trim(),
                dueDate: dueDate.value,
                priority: priority.value,
                completed: false
            });

            input.value = '';
            dueDate.value = '';
            priority.value = 'medium';
            save();
        }

        function toggleComplete(id) {
            assignments = assignments.map(a => 
                a.id === id ? { ...a, completed: !a.completed } : a
            );
            save();
        }

        function deleteAssignment(id) {
            assignments = assignments.filter(a => a.id !== id);
            save();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function render() {
            const list = document.getElementById('assignmentsList');
            const stats = document.getElementById('stats');
            
            const total = assignments.length;
            const completed = assignments.filter(a => a.completed).length;
            const remaining = total - completed;

            if (total === 0) {
                list.innerHTML = '<li class="empty-state">No assignments yet</li>';
                stats.innerHTML = '';
                return;
            }

            stats.innerHTML = `${remaining} remaining • ${completed} completed`;

            list.innerHTML = assignments
                .sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    const priorityOrder = { high: 0, medium: 1, low: 2 };
                    return priorityOrder[a.priority] - priorityOrder[b.priority];
                })
                .map(a => `
                    <li class="assignment-item ${a.completed ? 'completed' : ''}">
                        <div class="checkbox ${a.completed ? 'checked' : ''}" onclick="toggleComplete(${a.id})"></div>
                        <div class="assignment-info">
                            <div class="assignment-name">${escapeHtml(a.name)}</div>
                            <div class="assignment-meta">
                                <span class="priority-badge priority-${a.priority}">${a.priority}</span>
                                ${a.dueDate ? `<span>Due ${formatDate(a.dueDate)}</span>` : ''}
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteAssignment(${a.id})">Delete</button>
                    </li>
                `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('assignmentInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addAssignment();
        });

        applyTheme();
        render();
    </script>
</body>
</html>
